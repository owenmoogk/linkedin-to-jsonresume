name: Build, Test, and Release

on:
  push:
    branches:
      - '*'

    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build and package extension
        run: yarn package

      - name: Lint extension (web-ext)
        run: yarn lint:ext

      - name: Upload extension zip
        uses: actions/upload-artifact@v4
        with:
          name: extension-zip
          path: web-ext-artifacts/*.zip

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run ESLint
        run: yarn lint

      - name: Type Check
        run: yarn typecheck

  release:
    name: Create Release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [build, test]
    timeout-minutes: 45
    steps:
      - name: Check AMO credentials
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          if [ -z "$AMO_JWT_ISSUER" ] || [ -z "$AMO_JWT_SECRET" ]; then
            echo "::error::Missing AMO_JWT_ISSUER / AMO_JWT_SECRET repository secrets. Create API keys at https://addons.mozilla.org/developers/addon/api/key/ and add them under Settings -> Secrets and variables -> Actions, then re-run this workflow."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build and package extension
        run: yarn package

      # Bundled/minified code: AMO reviewers can ask for the source, so send it along
      - name: Create source archive
        run: git archive --format=zip -o source.zip HEAD

      # Submits to addons.mozilla.org (unlisted / self-distributed). The first
      # submission creates the add-on, using the ID from the manifest. Waits for
      # Mozilla to sign it, then downloads the signed .xpi to web-ext-artifacts/
      - name: Sign with Mozilla (AMO)
        run: yarn sign --upload-source-code source.zip
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}

      # Renames the signed .xpi to a stable name + writes updates.json (Firefox auto-update manifest)
      - name: Prepare release assets
        run: node scripts/release-assets.mjs

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          make_latest: true
          body: |
            ## Install

            **Firefox**: download [`linkedin-to-jsonresume.xpi`](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/linkedin-to-jsonresume.xpi) and open it in Firefox (or drag it into a Firefox window), then click **Add**. It's signed by Mozilla and updates itself automatically.

            **Chrome**: download the `.zip`, unzip it, and use **Load unpacked** on `chrome://extensions` (with Developer mode on).
          files: |
            web-ext-artifacts/linkedin-to-jsonresume.xpi
            web-ext-artifacts/*.zip
            web-ext-artifacts/updates.json
